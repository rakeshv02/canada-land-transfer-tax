<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canada Land Transfer Tax Calculator 2025 | Tabutility</title>
  <meta name="description" content="Calculate Canadian land transfer tax for all provinces plus Toronto municipal tax. First-time home buyer rebates included." />
  <meta name="keywords" content="canada land transfer tax calculator, ontario land transfer tax, bc property transfer tax, toronto ltt, first time home buyer rebate canada" />
  <link rel="canonical" href="https://canada-land-transfer-tax.tabutility.com/" />
  <meta property="og:title" content="Canada Land Transfer Tax Calculator 2025" />
  <meta property="og:description" content="Calculate land transfer tax for all Canadian provinces including first-time buyer rebates." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇨🇦</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n){return 'C$'+Math.round(n).toLocaleString();}
function fmtPct(n){return n.toFixed(2)+'%';}

function calcBands(price, bands) {
  let tax = 0, prev = 0;
  for (const b of bands) {
    const slice = Math.min(price, b.limit) - prev;
    if (slice <= 0) break;
    tax += slice * b.rate;
    prev = b.limit;
    if (price <= b.limit) break;
  }
  return tax;
}

const PROVINCES = {
  ON: {
    name: 'Ontario',
    torontoMunicipal: true,
    fhbRebate: 4000,
    torontoFhbRebate: 4475,
    calc: (p) => calcBands(p, [
      {limit:55000,rate:0.005},{limit:250000,rate:0.01},{limit:400000,rate:0.015},
      {limit:2000000,rate:0.02},{limit:Infinity,rate:0.025}
    ]),
    toronto: (p) => calcBands(p, [
      {limit:55000,rate:0.005},{limit:250000,rate:0.01},{limit:400000,rate:0.015},
      {limit:2000000,rate:0.02},{limit:Infinity,rate:0.025}
    ]),
  },
  BC: {
    name: 'British Columbia',
    fhbRebate: 8000,
    fhbThreshold: 500000,
    calc: (p) => calcBands(p, [
      {limit:200000,rate:0.01},{limit:2000000,rate:0.02},{limit:3000000,rate:0.03},{limit:Infinity,rate:0.05}
    ]),
  },
  QC: {
    name: 'Quebec',
    fhbRebate: 0,
    calc: (p) => calcBands(p, [
      {limit:50000,rate:0.005},{limit:250000,rate:0.01},{limit:500000,rate:0.015},{limit:Infinity,rate:0.02}
    ]),
  },
  MB: {
    name: 'Manitoba',
    fhbRebate: 0,
    calc: (p) => {
      if (p <= 150000) return 0;
      return calcBands(p, [{limit:150000,rate:0},{limit:200000,rate:0.005},{limit:Infinity,rate:0.01}]);
    },
  },
  NS: {
    name: 'Nova Scotia',
    fhbRebate: 0,
    calc: (p) => p * 0.015,
  },
  NB: {
    name: 'New Brunswick',
    fhbRebate: 0,
    calc: (p) => p * 0.01,
  },
  AB: { name: 'Alberta (no LTT)', fhbRebate: 0, calc: (_) => 0 },
  SK: { name: 'Saskatchewan', fhbRebate: 0, calc: (p) => p <= 27000 ? 0 : (p - 27000) * 0.003 },
};

function App() {
  const [price, setPrice] = useState(800000);
  const [province, setProvince] = useState('ON');
  const [fhb, setFhb] = useState(false);
  const [toronto, setToronto] = useState(false);

  const p = Number(price)||0;
  const prov = PROVINCES[province];

  let provTax = prov.calc(p);
  let torontoTax = toronto && prov.torontoMunicipal ? prov.toronto(p) : 0;

  let fhbSaving = 0;
  if (fhb) {
    fhbSaving = Math.min(provTax, prov.fhbRebate || 0);
    provTax -= fhbSaving;
    if (toronto && prov.torontoFhbRebate) {
      const torontoSaving = Math.min(torontoTax, prov.torontoFhbRebate);
      torontoTax -= torontoSaving;
      fhbSaving += torontoSaving;
    }
  }

  const total = provTax + torontoTax;
  const effective = p > 0 ? total / p * 100 : 0;

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#1e3a5f,#dc2626)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🇨🇦</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Canada Land Transfer Tax</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>All provinces · Toronto municipal LTT · FHB rebates 2025</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Purchase Price</label>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>C$</span>
              <input type="number" value={price} onChange={e=>setPrice(e.target.value)}
                style={{width:'100%',padding:'11px 12px 11px 36px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
            </div>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Province</label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {Object.entries(PROVINCES).map(([k,v])=>(
                <button key={k} onClick={()=>{setProvince(k);if(k!=='ON')setToronto(false);}} style={{padding:'9px',borderRadius:8,border:`2px solid ${province===k?'#dc2626':'#e5e7eb'}`,background:province===k?'#dc2626':'#fff',color:province===k?'#fff':'#374151',fontWeight:600,cursor:'pointer',fontSize:12}}>{v.name.split(' ')[0]}</button>
              ))}
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',fontSize:13,color:'#374151'}}>
              <input type="checkbox" checked={fhb} onChange={e=>setFhb(e.target.checked)} style={{accentColor:'#dc2626'}} />
              First-Time Home Buyer (apply rebate)
            </label>
            {province === 'ON' && (
              <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',fontSize:13,color:'#374151'}}>
                <input type="checkbox" checked={toronto} onChange={e=>setToronto(e.target.checked)} style={{accentColor:'#dc2626'}} />
                Buying in Toronto (add municipal LTT)
              </label>
            )}
          </div>
        </div>

        <div style={{background:'linear-gradient(135deg,#fef2f2,#fee2e2)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#991b1b'}}>TOTAL LAND TRANSFER TAX</div>
          <div style={{fontSize:44,fontWeight:900,color:'#dc2626',margin:'6px 0'}}>{fmt(total)}</div>
          {fhbSaving > 0 && <div style={{fontSize:13,color:'#16a34a',fontWeight:600}}>FHB rebate saved: {fmt(fhbSaving)}</div>}
          <div style={{fontSize:13,color:'#991b1b',marginTop:4}}>Effective rate: {fmtPct(effective)}</div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Purchase Price', fmt(p)],
            ['Province Tax ('+prov.name+')', fmt(provTax)],
            ...(toronto&&prov.torontoMunicipal?[['Toronto Municipal Tax', fmt(torontoTax)]]:[]),
            ...(fhbSaving>0?[['FHB Rebate Savings', '-'+fmt(fhbSaving)]]:[]),
            ['Total LTT', fmt(total)],
            ['Effective Rate', fmtPct(effective)],
            ['Total Cost', fmt(p+total)],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong style={{color:l.includes('Savings')?'#16a34a':l.includes('Total LTT')?'#dc2626':'#1a1a2e'}}>{v}</strong>
            </div>
          ))}
        </div>
        <div style={{background:'#fef2f2',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#991b1b',lineHeight:1.6}}>
          <strong>First-Time Buyer Rebates:</strong> Ontario up to C$4,000, Toronto up to C$4,475, BC up to C$8,000. Alberta, Saskatchewan have no LTT. Quebec municipalities may charge their own transfer tax. Always verify with a lawyer before closing.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
